schema: spec-driven

context: |
  Tech stack: Python 3.12+ (Django 6.1's own minimum; built and tested on 3.14, nothing depends
  on that specific version), Django 6.1, Django REST Framework 3.18.0, drf-spectacular 0.30.0,
  pytest 9.1.1 with pytest-django. SQLite by default - no environment variables required to run
  or test, still true for every contributor - with an opt-in switch to PostgreSQL for
  deployment: setting `DATABASE_URL` (e.g. `postgres://user:password@localhost:5432/dbname`)
  makes the app use Postgres instead. Project lives in sdd_django_demo/ (a Django project + `api`
  app) at the repo root; this ai-on-boarding repo also contains unrelated course/reference
  material (glossary.md, reference/, starter/) that is not part of the Django project.

  Domain: a small auth API (signup, signin, and an upcoming embargo/rules feature) built as a
  worked example of spec-driven development. No username field exists anywhere - email is the
  only account identifier. Django's built-in django.contrib.auth.User is reused; no custom user
  model. User.username is populated internally from the normalised (lowercased) email and is
  never part of any request/response contract.

  Prior work: openspec/changes/archive/2026-08-19-add-user-signup/ is the reference example for
  how a change should look end to end - proposal, delta spec, design, tasks (all checked), and
  the code and tests it produced.

  GitHub issues: every change has a matching issue in awais786/ai-on-boarding (created via `gh
  issue create` if one does not already exist for that feature). The issue is not just a task
  tracker - the proposal and the full delta spec get posted there too (via `gh issue comment`),
  so the issue is self-contained and readable without cloning the repo. Signup is issue #9,
  signin is issue #10, embargo is issue #15.

rules:
  proposal:
    - "State only externally observable behaviour (what a caller of the API can see) - no Django class names, serializer names, or ORM details. Save how it works for design.md."
    - "Every requirement must be independently testable. A requirement nobody could write a failing test against is not a requirement."
    - "Once all artifacts (proposal, specs, design, tasks) are complete, ensure a GitHub issue exists for this change (create one via gh issue create if not) and post the proposal and the full delta spec to it via gh issue comment, so the issue is self-contained and not just a link back to the repo."
  specs:
    - "Requirement identifiers (FR-XXX style, or the schema's equivalent) are permanent. A changed requirement keeps its number; a removed one leaves a gap; a new one takes the next free number. Never renumber."
  design:
    - "Every design decision must trace back to a requirement in the proposal or spec. A decision that does not satisfy a stated requirement is scope creep - cut it or add the requirement it is actually justifying."
    - "Prefer the simplest design that satisfies the requirements over one that anticipates requirements nobody has written down. Justify any new model, app, or dependency explicitly - do not let it slide in silently."
  tasks:
    - "This project does not practise test-driven development: no task may instruct writing a test before the implementation it tests exists, and no task list may be ordered so tests run or are written first. A test-writing task IS expected, but it belongs in its own section after every implementation task, written from the spec once the code exists - see openspec/changes/archive/2026-08-19-add-user-signup/tasks.md's '## 3. Tests' section for the reference shape: list requirements, write tests from that list, run them, then prove at least one can fail."
    - "tasks.md is the last artifact created for a change. Once it exists, all four artifacts are complete - this is the point to ensure a GitHub issue exists for the change and to post the proposal and delta spec to it (see the GitHub issues note in context above), not something to defer to a separate session."

operations:
  apply:
    guidance:
      - "Once implementation tasks are complete, write tests from the spec or proposal, not from reading the code, covering every requirement. Name tests after the behaviour they protect, not the function they call."
      - "Security-sensitive behaviour (authentication, credential storage, credential exposure) needs a test that asserts it directly, not incidentally through a success-path test."
      - "Credentials never appear as literals in tracked files. API keys, tokens, signing secrets, and passwords are read from the environment or Django settings, the way SECRET_KEY and DATABASE_URL already are - never written into source, fixtures, or config that git tracks. A secret committed to a tracked file is exposed from that commit onward whether or not the code using it ever runs, so unreachable or not-yet-wired code is no exception, and the fix is to rotate the secret, not only to delete the line."
      - "Prove at least one new test can actually fail - break the implementation on purpose, confirm the right test goes red, then restore it. A test only ever observed passing is not yet evidence of anything."
      - "Build or extend traceability.md mapping every requirement to its code and test."
      - "Run /code-review before opening a pull request. Findings only block if they cite a requirement id, a specific named failing test, or a documented convention (this file, CLAUDE.md, or AGENTS.md) - anything else is a nit. Review runs at most two passes, an initial pass and one follow-up after fixes. Every review ends with an explicit verdict, stated as Ready to merge: yes or Ready to merge: no, never an open-ended list with no conclusion."
      - "Never hand-patch generated code to make it pass. If generated output is wrong, fix the proposal, spec, design, or a project skill, and regenerate."
  archive:
    guidance:
      - "Only archive a change once /code-review has returned a Ready to merge: yes verdict for it."
      - "Confirm pytest passes for the whole project, not just the new change's tests, before archiving."
